name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'package.json'
      - '*.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle offline NES emulator
        run: |
          npm install --no-audit --no-fund
          npm run build:nes
      - name: Fetch Famidash ROM
        run: |
          curl -fL --retry 3 --retry-delay 2 'https://github.com/tfdsoft/famidash/releases/download/Demo5/famidash.nes' -o app/src/main/assets/famidash.nes
          python -c "from pathlib import Path; p=Path('app/src/main/assets/famidash.nes'); b=p.read_bytes(); assert b[:4] == b'NES\\x1a', 'Invalid NES ROM header'; assert len(b) == 786448, f'Unexpected ROM size: {len(b)}'; print(f'Validated Famidash ROM: {len(b)} bytes')"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Geometry-Jump-v0.6.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
