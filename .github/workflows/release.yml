name: Build and publish Android release
on:
  push:
    branches: [ main ]
    paths: [ 'app/**', '*.gradle', 'settings.gradle', 'gradle.properties', '.github/workflows/release.yml' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Check JavaScript syntax
        run: node --check app/src/main/assets/game.js
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.0
          name: Geometry Jump v0.5.0
          make_latest: true
          generate_release_notes: true
          overwrite_files: true
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            ## Geometry Jump v0.5.0
            - Rebuilt the game engine and stage progression.
            - Added 12 original stages with early-era-inspired mechanics.
            - Added cube, ship, UFO and gravity-ball modes, pads/orbs and portals.
            - Added responsive rendering, input handling, pause/retry, local progress and generated sound effects.
            - Removed remote soundtrack dependencies.
            - Added JavaScript syntax validation before Android compilation.
            Unofficial fan-made game; not affiliated with RobTop Games.
