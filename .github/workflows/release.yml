name: Build and publish Android release

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          name: Geometry Jump v0.3.0
          make_latest: true
          generate_release_notes: true
          overwrite_files: true
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            ## Geometry Jump v0.3.0

            - Replaced the initial prototype with an open-source canvas game base.
            - Improved frame stepping and mobile canvas scaling.
            - Added Newgrounds soundtrack tracks with artist attribution and remote-playback fallback.
            - Added open-source and third-party notices.
            - Added a 17-level progressive campaign plus the three original bonus stages (20 playable levels total).
            - Added mirror portals, ball gravity switching, blue jump pads/orbs, mini/large portals, and pink jump pads/orbs.
            - Reworked level selection into a compact grid for the expanded campaign.

            ### Music credits
            - **Air Shifter** — JensVide: https://www.newgrounds.com/audio/listen/1378746
            - **Dark Allure** — JensVide: https://www.newgrounds.com/audio/listen/1373649

            The artist lists these tracks under Creative Commons terms permitting reuse with attribution. Availability in the official Geometry Dash whitelist is separate from permission to reuse the music in this fan-made game. Not affiliated with RobTop Games or Newgrounds.
