name: Build and publish Android release

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.1
          name: Geometry Jump v0.4.1
          make_latest: true
          generate_release_notes: true
          overwrite_files: true
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            ## Geometry Jump v0.4.1

            - Standardized the app's visible name as Geometry Jump vX.Y.Z.
            - Set the Android launcher label and in-game WebView page title to Geometry Jump v0.4.1.
            - Incremented Android versionCode to 5 and versionName to 0.4.1.
            - Retained the original geometric logo, classic early-era visual style, and keyboard input fixes.

            Not affiliated with RobTop Games.
