<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111b2b">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<title>Geometry Jump v0.6.0</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">GJ</span><span>GEOMETRY JUMP <small>v0.6.0</small></span></div>
    <div class="top-actions"><span class="edition">FAMIDASH · NES</span><button id="pause-button" type="button">Pausar</button></div>
  </header>
  <div id="status" role="status" aria-live="polite">Iniciando emulador…</div>
  <section id="screen" aria-label="Pantalla de Famidash"></section>
  <section id="rom-panel" aria-label="Cargar ROM">
    <button id="choose-rom" type="button" hidden>Seleccionar ROM .nes</button>
    <input id="rom-picker" type="file" accept=".nes,application/octet-stream" hidden>
  </section>
  <section id="touch-controls" aria-label="Controles táctiles" hidden>
    <div class="dpad">
      <button type="button" data-button="up" aria-label="Arriba" class="up">▲</button>
      <button type="button" data-button="left" aria-label="Izquierda" class="left">◀</button>
      <button type="button" data-button="down" aria-label="Abajo" class="down">▼</button>
      <button type="button" data-button="right" aria-label="Derecha" class="right">▶</button>
    </div>
    <div class="system-buttons">
      <button type="button" data-button="select">SELECT</button>
      <button type="button" data-button="start">START</button>
    </div>
    <div class="action-buttons">
      <button type="button" data-button="b" class="button-b">B</button>
      <button type="button" data-button="a" class="button-a">A</button>
    </div>
  </section>
  <footer>Teclado: ESPACIO / ↑ / W = A · ENTER = START · flechas = dirección · Z = B</footer>
</main>
<script src="nes-player.bundle.js"></script>
</body>
</html>
