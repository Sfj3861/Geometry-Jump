<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090d20"><title>Geometry Jump</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d20;color:#fff;font-family:system-ui,Segoe UI,sans-serif;touch-action:manipulation}canvas{display:block;width:100%;height:100%;touch-action:manipulation}button{font:700 15px system-ui;color:white;border:1px solid #6ff4ff88;border-radius:12px;padding:12px 18px;background:linear-gradient(135deg,#1a8bce,#7346dd);box-shadow:0 5px 20px #0005}button:active{transform:scale(.97)}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(130deg,#080d21dd,#101844cc);text-align:center;padding:18px}#panel{width:min(620px,94vw);padding:24px;border:1px solid #63f3ff66;border-radius:22px;background:#101831eF;box-shadow:0 0 60px #25c9ff18}h1{font-size:clamp(28px,6vw,54px);margin:0 0 6px;letter-spacing:2px;text-shadow:0 0 24px #21d9ff}p{color:#c4d6f7;margin:8px 0 20px}.buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}.small{font-size:12px;color:#93a9d6;margin-top:15px}#hud{position:absolute;left:14px;right:14px;top:10px;display:flex;justify-content:space-between;pointer-events:none;font-weight:800;text-shadow:0 2px 5px #000;font-size:clamp(12px,2.4vw,18px)}#hud span{background:#081329a8;padding:7px 10px;border-radius:9px}#mute{position:absolute;right:12px;bottom:10px;padding:7px 10px;font-size:12px}
</style></head><body>
<canvas id="game"></canvas><div id="hud" hidden><span id="levelText">LEVEL 1</span><span id="percent">0%</span><span id="best">BEST 0%</span></div><button id="mute" hidden>♫ SONIDO</button>
<div id="overlay"><div id="panel"><h1>GEOMETRY JUMP</h1><p>Salta al ritmo. No choques. ¡Llega al 100%!</p><div class="buttons"><button id="play">JUGAR</button><button id="practice">PRÁCTICA</button><button id="levels">NIVELES</button></div><div class="small">Toca la pantalla o pulsa ESPACIO para saltar · Pausa con ESC</div></div></div>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay'),panel=document.querySelector('#panel'),hud=document.querySelector('#hud'),percentEl=document.querySelector('#percent'),bestEl=document.querySelector('#best'),levelText=document.querySelector('#levelText'),muteBtn=document.querySelector('#mute');
let W=960,H=540,dpr=1,mode='menu',last=0,world=0,speed=340,gravity=1900,jumpV=-680,player,obstacles=[],particles=[],level=0,practice=false,muted=false,audio=null,startedAt=0,attempt=0,ground=0,progress=0, bests=[0,0,0], levels=[
{name:'NEON RUN',speed:340,length:4300,color:'#25e5ff',accent:'#7b55ff',gaps:[780,1560,2470,3350]},
{name:'VIOLET STORM',speed:390,length:5100,color:'#c879ff',accent:'#ff4fa3',gaps:[920,1900,2880,4010]},
{name:'SOLAR FLARE',speed:430,length:5700,color:'#ffd45e',accent:'#ff5b4d',gaps:[1050,2200,3450,4550]}
];
try{bests=JSON.parse(localStorage.getItem('gj-bests')||'[0,0,0]')}catch(e){}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ground=H*.79}addEventListener('resize',resize);resize();
function audioInit(){if(muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){}}
function tone(freq=440,dur=.07,type='square',vol=.035){if(muted||!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}
function setOverlay(title,desc,buttons){overlay.hidden=false;panel.innerHTML='<h1>'+title+'</h1><p>'+desc+'</p><div class="buttons">'+buttons+'</div><div class="small">Toca para saltar · ESPACIO para saltar · ESC para volver</div>'}
function start(pr=false,l=level){audioInit();level=l;practice=pr;mode='playing';world=0;progress=0;attempt++;player={x:W*.22,y:ground-34,vy:0,size:Math.max(22,Math.min(34,H*.062)),rot:0,grounded:true};obstacles=[];particles=[];let cfg=levels[level];speed=cfg.speed;let x=480;while(x<cfg.length+W){let r=Math.random();if(r<.66){obstacles.push({x:x+Math.random()*90,w:30,h:34+Math.random()*35,type:'spike'});if(Math.random()<.34)obstacles.push({x:x+Math.random()*45+42,w:30,h:35+Math.random()*28,type:'spike'})}else if(r<.84){obstacles.push({x:x,w:32,h:30+Math.random()*22,type:'block'})}x+=220+Math.random()*180}cfg.gaps.forEach(g=>obstacles.push({x:g,w:90,h:0,type:'gap'}));obstacles.sort((a,b)=>a.x-b.x);overlay.hidden=true;hud.hidden=false;muteBtn.hidden=false;levelText.textContent='LEVEL '+(level+1)+' · '+cfg.name;bestEl.textContent='BEST '+(bests[level]||0)+'%';last=performance.now();startedAt=last;requestAnimationFrame(loop)}
function jump(){if(mode!=='playing')return;audioInit();if(player.grounded){player.vy=jumpV;player.grounded=false;tone(560,.06,'square',.025)}}
function hitTest(){let p=player,px=p.x,py=p.y,s=p.size;for(const o of obstacles){let ox=o.x-world+W*.22;if(ox>px+s+5)break;if(ox+o.w<px-5)continue;if(o.type==='gap'){if(px+s*.7>ox&&px+s*.25<ox+o.w&&p.y+s>=ground-1)return true}else if(o.type==='spike'){let bx=ox+o.w*.18,bw=o.w*.64,top=ground-o.h;if(px+s*.78>bx&&px+s*.22<bx+bw&&py+s*.78>top)return true}else{if(px+s>ox+3&&px<ox+o.w-3&&py+s>ground-o.h+3)return true}}return false}
function burst(x,y,color,n=12){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*330,vy:(Math.random()-.8)*330,life:.35+Math.random()*.45,color,size:2+Math.random()*5})}
function die(){if(mode!=='playing')return;mode='dead';tone(110,.25,'sawtooth',.05);burst(player.x+player.size/2,player.y+player.size/2,levels[level].color,28);let pct=Math.min(99,Math.floor(progress/levels[level].length*100));bests[level]=Math.max(bests[level]||0,pct);localStorage.setItem('gj-bests',JSON.stringify(bests));bestEl.textContent='BEST '+bests[level]+'%';setTimeout(()=>{if(mode==='dead')setOverlay('¡CRASH!','Has llegado al '+pct+'%. Cada intento te acerca más.', '<button id="retry">REINTENTAR</button><button id="menu">MENÚ</button>');document.querySelector('#retry')?.addEventListener('click',()=>start(practice,level));document.querySelector('#menu')?.addEventListener('click',showMenu)},250)}
function win(){mode='won';bests[level]=100;localStorage.setItem('gj-bests',JSON.stringify(bests));tone(880,.18,'triangle',.06);setOverlay('¡NIVEL COMPLETADO!','100% · '+levels[level].name,'<button id="next">SIGUIENTE</button><button id="menu">MENÚ</button>');document.querySelector('#next').addEventListener('click',()=>start(false,(level+1)%levels.length));document.querySelector('#menu').addEventListener('click',showMenu)}
function showMenu(){mode='menu';hud.hidden=true;muteBtn.hidden=true;setOverlay('GEOMETRY JUMP','Un plataformas rítmico de precisión. ¡Supera los tres niveles!','<button id="play">JUGAR</button><button id="practice">PRÁCTICA</button><button id="levels">NIVELES</button>');bindMenu()}
function bindMenu(){document.querySelector('#play')?.addEventListener('click',()=>start(false,level));document.querySelector('#practice')?.addEventListener('click',()=>start(true,level));document.querySelector('#levels')?.addEventListener('click',()=>{setOverlay('ELIGE NIVEL','Mejores marcas: '+bests.map((x,i)=>'N'+(i+1)+' '+x+'%').join(' · '),levels.map((l,i)=>'<button data-level="'+i+'">'+(i+1)+'. '+l.name+'</button>').join('')+'<button id="back">VOLVER</button>');document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>start(false,+b.dataset.level)));document.querySelector('#back').addEventListener('click',showMenu)})}
function drawBackground(cfg,dt){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#090d20');g.addColorStop(1,'#17183e');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=.35;for(let i=0;i<65;i++){let x=((i*137-world*.12)%(W+40)+W+40)%(W+40),y=(i*71)%Math.max(1,ground-20);ctx.fillStyle=i%3?cfg.color:cfg.accent;ctx.fillRect(x,y,2,2)}ctx.globalAlpha=1;ctx.strokeStyle=cfg.color+'30';ctx.lineWidth=1;let grid=44,off=world%grid;for(let x=-off;x<W;x+=grid){ctx.beginPath();ctx.moveTo(x,ground);ctx.lineTo(x,H);ctx.stroke()}for(let y=ground;y<H;y+=grid){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.fillStyle='#151d3c';ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle=cfg.color;ctx.fillRect(0,ground,W,3);ctx.shadowBlur=16;ctx.shadowColor=cfg.color;ctx.fillRect(0,ground,W,2);ctx.shadowBlur=0}
function draw(){let cfg=levels[level];drawBackground(cfg);for(const o of obstacles){let x=o.x-world+W*.22;if(x<-100||x>W+100)continue;if(o.type==='spike'){ctx.fillStyle=cfg.color;ctx.shadowColor=cfg.color;ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(x,ground);ctx.lineTo(x+o.w/2,ground-o.h);ctx.lineTo(x+o.w,ground);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#ffffffaa';ctx.stroke()}else if(o.type==='block'){ctx.fillStyle=cfg.accent;ctx.shadowColor=cfg.accent;ctx.shadowBlur=12;ctx.fillRect(x,ground-o.h,o.w,o.h);ctx.shadowBlur=0;ctx.strokeStyle='#ffffffaa';ctx.strokeRect(x+3,ground-o.h+3,o.w-6,o.h-6)}else{ctx.fillStyle='#030714';ctx.fillRect(x,ground-1,o.w,H-ground+1);ctx.strokeStyle=cfg.accent;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,ground);ctx.lineTo(x+o.w,ground);ctx.stroke()}}
if(player){ctx.save();ctx.translate(player.x+player.size/2,player.y+player.size/2);ctx.rotate(player.rot);ctx.shadowColor=cfg.color;ctx.shadowBlur=22;ctx.fillStyle=cfg.color;ctx.fillRect(-player.size/2,-player.size/2,player.size,player.size);ctx.shadowBlur=0;ctx.strokeStyle='#ffffff';ctx.lineWidth=2;ctx.strokeRect(-player.size/2+4,-player.size/2+4,player.size-8,player.size-8);ctx.fillStyle='#0b1025';ctx.fillRect(-player.size*.23,-player.size*.12,player.size*.12,player.size*.16);ctx.fillRect(player.size*.1,-player.size*.12,player.size*.12,player.size*.16);ctx.restore()}
for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size)}ctx.globalAlpha=1}
function loop(now){if(mode!=='playing')return;let dt=Math.min(.033,(now-last)/1000||0);last=now;let cfg=levels[level];world+=speed*dt;progress=world;player.vy+=gravity*dt;player.y+=player.vy*dt;if(player.y+player.size>=ground){player.y=ground-player.size;player.vy=0;player.grounded=true;player.rot=Math.round(player.rot/(Math.PI/2))*(Math.PI/2)}else player.rot+=dt*5.8;for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=650*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);percentEl.textContent=Math.min(100,Math.floor(progress/cfg.length*100))+'%';if(hitTest()){die()}else if(progress>=cfg.length){win()}draw();if(mode==='playing')requestAnimationFrame(loop)}
function action(){if(mode==='playing')jump()}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();action()});addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(mode==='menu')start(false,level);else action()}if(e.code==='Escape'){if(mode==='playing')showMenu();else showMenu()}});muteBtn.addEventListener('click',()=>{muted=!muted;muteBtn.textContent=muted?'♫ SILENCIO':'♫ SONIDO';if(!muted)audioInit()});
window.gameBack=()=>showMenu();bindMenu();
})();
</script></body></html>
